<!DOCTYPE html>
<html>
<head>
  <title>Google Login</title>
</head>
<body>

<h2>Google Login Demo</h2>

<button onclick="login()">
  Sign In With Google
</button>

<p id="user"></p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlLpN3QPByHr-gwmqOEFzR8jl5szfLJGI",
  authDomain: "my-login-site-e11e9.firebaseapp.com",
  projectId: "my-login-site-e11e9",
  storageBucket: "my-login-site-e11e9.firebasestorage.app",
  messagingSenderId: "733659226183",
  appId: "1:733659226183:web:1dcb19d81235b7ee64d162",
  measurementId: "G-LXRNQ4959H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function() {

  const provider = new GoogleAuthProvider();

  signInWithPopup(auth, provider)
    .then((result) => {

      document.getElementById("user").innerHTML =
        "Welcome " + result.user.displayName;

    })
    .catch((error) => {
      console.log(error);
      alert(error.message);
    });

}

</script>

</body>
</html>
